name: snake

on:
  schedule:
    - cron: "0 0 * * *"  
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Create snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Th33raphat
          outputs: |
            dist/snake.svg?color_snake=#ffbb1e&color_dots=#fff8e1,#ffe08a,#ffd75e,#ffbb1e,#e89b00

      - name: Push snake to output branch
        uses: crazy-max/ghaction-github-pages@v3
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}